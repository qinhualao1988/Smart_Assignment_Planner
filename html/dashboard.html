<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Planner</title>
        <link rel="stylesheet" href="../planner.css">
    </head>
    <body>
        <header>
            <h1>Student Planner</h1>
            <p>You can do anything if you take it one step at a time</p>
        </header>
        <main>
            <section class="panel">
                <h2>Add an assignment</h2>
                <form id="event-form" class="event-form">
                    <label>
                        Title of Assignment
                        <input id="event-title" type="text"
                        placeholder="What's next on the agenda?"
                        required maxlength="100">
                    </label>
                    <label>
                        Date
                        <input id="event-date" type="date" required>
                    </label>
                    <label>
                        Time
                        <input id="event-time" type="time">
                    </label>
                    <label>
                        Category
                        <select id="event-category">
                            <option value="class">Class</option>
                            <option value="assignment">Assignment</option>
                            <option value="exam">Exam</option>
                            <option value="meeting">Meeting</option>
                            <option value="personal">Personal</option>
                        </select>
                    </label>
                    <button class="primary" type="submit">
                        Add
                    </button>
                </form>
            </section>

            <section style="margin-top: 25px;">
                <div class="toolbar">
                    <div>
                        <button id="previous-month"
                            aria-label="Previous Month">←</button>
                        <button id="next-month"
                            aria-label="Next Month">→</button>
                        <button id="today-button">Today</button>
                    </div>
                    <div class="view-controls"
                        aria-label="Planner View">
                        <button id="calendar-button"
                            class="active"
                            aria-pressed="true">Calendar</button>
                        <button id="list-button"
                            aria-pressed="false">List</button>
                    </div>
                </div>
                <div class="panel">
                    <h2 id="view-heading" aria-live="polite"></h2>
                    <div id="calendar-view">
                        <div class="calendar" id="calendar-grid"></div>
                    </div>
                    <div id="list-view" hidden>
                        <h2>Scheduled Events</h2>
                        <div id="event-list"></div>
                    </div>
                </div>
            </section>
        </main>
        <script src="../js/plannerScript.js" defer></script>
    </body>
</html>
